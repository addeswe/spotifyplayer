user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        listen [::]:8080;

        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
                        #auth_basic "Hello stranger";
                        #auth_basic_user_file /etc/nginx/password/limegreen;

                        # Säkerställ att vi fångar upp allt efter /spotify
                        rewrite ^/spotify(?:/(.*))?$ /$1 break;

                        # Genom att lägga till $uri här tvingar vi proxy_pass att använda den omskrivna sökvägen
                        proxy_pass http://127.0.0.1$uri;

                        proxy_buffering off;
                        proxy_http_version 1.1;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection $http_connection;
                        access_log off;
                }
        # Caching för statiska filer
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
